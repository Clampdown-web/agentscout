<script>(function(){function pt(){try{return new Intl.DateTimeFormat("en-CA",{timeZone:"America/Los_Angeles",year:"numeric",month:"2-digit",day:"2-digit"}).format(new Date())}catch(e){var d=new Date(Date.now()-7*36e5);return d.toISOString().slice(0,10)}}
function back(s,n){var d=new Date(s+"T00:00:00Z");d.setUTCDate(d.getUTCDate()-n);return d.toISOString().slice(0,10)}
window.ASstats=function(tools){var t=pt(),w=back(t,6),m=back(t,29),c={};tools.forEach(function(x){c[x.category]=1});return{total:tools.length,today:tools.filter(function(x){return x.added===t}).length,week:tools.filter(function(x){return (x.added||"")>=w}).length,month:tools.filter(function(x){return (x.added||"")>=m}).length,cats:Object.keys(c).length}};
fetch("api/tools.json",{cache:"no-cache"}).then(function(r){return r.json()}).then(function(d){var s=ASstats(Array.isArray(d)?d:d.tools||[]);var el=document.getElementById("rstats");if(!el)return;
el.innerHTML=[["Total tools",s.total],["Added today",s.today],["This week",s.week],["This month",s.month],["Categories",s.cats]].map(function(p){return '<div class="rstat"><b>'+p[1]+'</b><span>'+p[0]+'</span></div>'}).join("");var n=document.getElementById("rsum");if(n)n.textContent=s.total+" tools · "+s.week+" new this week · "+s.cats+" categories · every link checked";var lc=document.getElementById("rchecked");if(lc&&d.last_checked){var p=d.last_checked.split("-");lc.textContent="Links last checked "+["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"][+p[1]-1]+" "+(+p[2])+", "+p[0]}})})();</script>
