name: security

# Offline worker tests plus an advisory scan of requirements.txt.
# contents: read. No secrets, no pull_request_target, no deploy.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  worker-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Auth and validation tests
        run: >-
          node --test
          cloudflare-api-worker/test/ssrf.test.mjs
          cloudflare-api-worker/test/votes.test.mjs
          cloudflare-api-worker/test/roast.test.mjs
          cloudflare-api-worker/test/ratelimit.test.mjs
          cloudflare-mcp-worker/test/rate-limit.test.mjs
          cloudflare-image-worker-patches/security.test.mjs
          cloudflare-image-worker-patches/backup.test.mjs
          cloudflare-image-worker-patches/captured-handler.test.mjs
          free_tools_js/escape.test.mjs
          free_tools_js/reviews.test.mjs

  python-requirements:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Audit pinned requirements
        run: |
          python -m pip install --disable-pip-version-check pip-audit==2.10.1
          python -m pip_audit -r requirements.txt
