name: mcp response rate

# Daily read-only MCP initialize + tools/list for a rotating slice of listed
# servers that publish a public remote endpoint. Appends data/mcp-health,
# restamps the pages that read it, and opens one pull request. It does not
# push to main.
# The branch is cut from origin/main at commit time. Older open
# bot/mcp-health pull requests are closed after the new one exists, and their
# probe rows are carried forward so a day that did not merge is not dropped.
# A pull request opened with GITHUB_TOKEN does not start pull_request workflows.
# The ruleset requires the guardrails check on the head commit. This job
# dispatches guardrails, security, gitleaks, and codeql (workflow_dispatch is
# allowed for GITHUB_TOKEN) so that check is reported. No new secret is
# required. If the repository already has MCP_HEALTH_PR_TOKEN, the pull
# request is opened with it and the pull_request workflows run on their own.
# No deploy, no tool calls.
on:
  schedule:
    # 15:15 UTC. 7:15 AM Pacific during standard time, 8:15 AM during daylight time.
    - cron: "15 15 * * *"
  workflow_dispatch:
    inputs:
      limit:
        description: "Servers to probe this run"
        required: false
        default: "600"

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: mcp-response-rate
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The job pushes a new branch and opens a pull request. The token is not stored in the remote.
          persist-credentials: true
      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Carry unmerged handshake rows onto fresh main
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/mcp_health_publish.py carry --repo "${GITHUB_WORKSPACE}" --slug "$GITHUB_REPOSITORY"
      - name: Probe
        run: |
          set -euo pipefail
          limit="${PROBE_LIMIT:-600}"
          case "$limit" in
            ''|*[!0-9]*) limit=600 ;;
          esac
          python3 scripts/mcp_response_rate.py --limit "$limit"
        env:
          PROBE_LIMIT: ${{ github.event.inputs.limit }}
      - name: Rebuild pages and open one pull request
        env:
          # Empty when the owner has not added it. The job still dispatches the
          # required guardrails check with GITHUB_TOKEN. No new secret is required.
          GH_TOKEN: ${{ secrets.MCP_HEALTH_PR_TOKEN != '' && secrets.MCP_HEALTH_PR_TOKEN || github.token }}
          DISPATCH_CI: ${{ secrets.MCP_HEALTH_PR_TOKEN == '' && '1' || '0' }}
        run: python3 scripts/mcp_health_publish.py publish --repo "${GITHUB_WORKSPACE}" --slug "$GITHUB_REPOSITORY" --run-id "$GITHUB_RUN_ID"
