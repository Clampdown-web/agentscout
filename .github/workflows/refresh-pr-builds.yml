name: refresh pr builds

# Keep generated files current on open, non-draft, same-repo pull requests
# that carry the auto-rebuild label. Drafts and forks are skipped.
# build_site.py takes about 17 minutes. The job budget also covers checkout,
# a cached pip install, the local checks, and waiting for CI to finish.
# A push with GITHUB_TOKEN does not start pull_request or push workflows.
# After a successful push this workflow dispatches those workflows
# (workflow_dispatch is allowed for GITHUB_TOKEN) and waits.
# Merge commits only. Never force-push and never rewrite history.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      pr:
        description: "Pull request number to refresh"
        required: true
        type: string
  pull_request:
    types: [labeled]
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: refresh-pr-builds
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      prs: ${{ steps.plan.outputs.prs }}
      count: ${{ steps.plan.outputs.count }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Choose pull requests
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_LABEL: ${{ github.event.label.name }}
          EVENT_PR: ${{ github.event.pull_request.number }}
          INPUT_PR: ${{ inputs.pr }}
        run: python3 scripts/refresh_pr_build.py plan

  refresh:
    needs: plan
    if: needs.plan.outputs.count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    concurrency:
      group: refresh-pr-${{ matrix.pr.number }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        pr: ${{ fromJson(needs.plan.outputs.prs) }}
    env:
      REFRESH_FORCE: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
      PR_NUMBER: ${{ matrix.pr.number }}
      PR_BRANCH: ${{ matrix.pr.branch }}
    steps:
      - name: Checkout pull request branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ matrix.pr.branch }}
          fetch-depth: 0
          persist-credentials: true

      - name: Fetch main and the refresh driver
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          driver="${RUNNER_TEMP}/driver"
          mkdir -p "${driver}/scripts/guardrails"
          if git cat-file -e origin/main:scripts/refresh_pr_build.py 2>/dev/null; then
            src=origin/main
          else
            src=HEAD
          fi
          git show "${src}:scripts/refresh_pr_build.py" > "${driver}/scripts/refresh_pr_build.py"
          git show "${src}:scripts/guardrails/pages.py" > "${driver}/scripts/guardrails/pages.py"
          echo "DRIVER=${driver}" >> "${GITHUB_ENV}"

      - name: Merge main
        id: merge
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 "${DRIVER}/scripts/refresh_pr_build.py" merge --repo "${GITHUB_WORKSPACE}" --main origin/main --pr "${PR_NUMBER}" --slug "${GITHUB_REPOSITORY}"

      - name: Decide whether to rebuild
        id: gate
        run: |
          set -euo pipefail
          if [ "${STATUS}" = "source_conflict" ]; then
            echo "proceed=0" >> "${GITHUB_OUTPUT}"
          elif [ "${STATUS}" = "up_to_date" ] && [ "${REFRESH_FORCE}" != "1" ]; then
            echo "proceed=0" >> "${GITHUB_OUTPUT}"
          elif [ "${STATUS}" = "merged" ] || [ "${STATUS}" = "up_to_date" ]; then
            echo "proceed=1" >> "${GITHUB_OUTPUT}"
          else
            echo "unexpected merge status ${STATUS}" >&2
            exit 1
          fi

      - name: Setup Python
        if: steps.gate.outputs.proceed == '1'
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-build.txt
            requirements.txt

      - name: Setup Node
        if: steps.gate.outputs.proceed == '1'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Install build dependencies
        if: steps.gate.outputs.proceed == '1'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libcairo2
          python3 -m pip install --disable-pip-version-check -r requirements-build.txt

      - name: Rebuild generated files
        if: steps.gate.outputs.proceed == '1'
        run: |
          set -euo pipefail
          python3 build_site.py
          python3 build_lastmod.py
          python3 daily_update.py

      - name: Run morning checks
        if: steps.gate.outputs.proceed == '1'
        env:
          GH_TOKEN: ${{ github.token }}
          PIPELINE_SKIP: live
        run: |
          set -euo pipefail
          set +e
          python3 scripts/morning_pipeline.py > "${RUNNER_TEMP}/pipeline.txt" 2>&1
          code=$?
          set -e
          cat "${RUNNER_TEMP}/pipeline.txt"
          if [ "${code}" != "0" ]; then
            python3 "${DRIVER}/scripts/refresh_pr_build.py" comment --pr "${PR_NUMBER}" --kind checks --log "${RUNNER_TEMP}/pipeline.txt"
            exit "${code}"
          fi

      - name: Commit the rebuild
        id: rebuild
        if: steps.gate.outputs.proceed == '1'
        run: python3 "${DRIVER}/scripts/refresh_pr_build.py" commit-rebuild --repo "${GITHUB_WORKSPACE}" --main-sha "${MAIN_SHA}"

      - name: Push
        id: push
        if: steps.gate.outputs.proceed == '1' && (env.STATUS == 'merged' || env.REBUILD == 'committed')
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 "${DRIVER}/scripts/refresh_pr_build.py" push --repo "${GITHUB_WORKSPACE}" --branch "${PR_BRANCH}" --pr "${PR_NUMBER}" --main-sha "${MAIN_SHA}"

      - name: Re-run pull request checks
        if: steps.push.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 "${DRIVER}/scripts/refresh_pr_build.py" dispatch-ci --repo "${GITHUB_WORKSPACE}" --branch "${PR_BRANCH}" --pr "${PR_NUMBER}" --base "${MAIN_SHA}"
