name: production smoke

# Read-only GET checks against the live site and workers.
# No secrets, no POST, no deploy. The job summary lists every pass and failure.
# pages-build-deployment is GitHub's Pages workflow. workflow_run is what
# actually starts after that workflow, because a deployment it creates with
# the built-in token does not start other workflows. deployment_status is
# still wired for a github-pages success in case GitHub delivers one.
on:
  workflow_dispatch:
  schedule:
    - cron: "20 17 * * *"
  workflow_run:
    workflows: ["pages-build-deployment"]
    types: [completed]
  deployment_status:

permissions:
  contents: read

concurrency:
  group: production-smoke
  cancel-in-progress: false

jobs:
  smoke:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') || (github.event_name == 'deployment_status' && github.event.deployment_status.state == 'success' && github.event.deployment.environment == 'github-pages')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check production
        run: python3 scripts/smoke_production.py
