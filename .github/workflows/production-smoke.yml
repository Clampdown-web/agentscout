name: production smoke

# Read-only GET checks against the live site and workers.
# No secrets, no POST, no deploy. The job summary lists every pass and failure.
# pages-build-deployment is GitHub's Pages workflow. workflow_run is what
# actually starts after that workflow, because a deployment it creates with
# the built-in token does not start other workflows. deployment_status is
# still wired for a github-pages success in case GitHub delivers one.
on:
  workflow_dispatch:
  schedule:
    - cron: "20 17 * * *"
  workflow_run:
    workflows: ["pages-build-deployment"]
    types: [completed]
  deployment_status:

permissions:
  contents: read

concurrency:
  group: production-smoke
  cancel-in-progress: false

jobs:
  smoke:
    # The event filter stays on the steps, not the job. When every job is
    # skipped, GitHub can leave the run in_progress and hold this concurrency
    # group (cancel-in-progress is false), so the next smoke stays pending.
    # A job that always starts still finishes, and releases the group, when
    # the check itself is skipped.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Decide
        id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          DEPLOY_STATE: ${{ github.event.deployment_status.state }}
          DEPLOY_ENV: ${{ github.event.deployment.environment }}
        run: |
          run=false
          if [ "$EVENT_NAME" = "workflow_dispatch" ] || [ "$EVENT_NAME" = "schedule" ]; then
            run=true
          elif [ "$EVENT_NAME" = "workflow_run" ] && [ "$RUN_CONCLUSION" = "success" ]; then
            run=true
          elif [ "$EVENT_NAME" = "deployment_status" ] && [ "$DEPLOY_STATE" = "success" ] && [ "$DEPLOY_ENV" = "github-pages" ]; then
            run=true
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "production smoke will run: $run"
      - name: Checkout
        if: steps.gate.outputs.run == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check production
        if: steps.gate.outputs.run == 'true'
        run: python3 scripts/smoke_production.py
